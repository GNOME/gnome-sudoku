[package]
name = "gnome-sudoku"
version = "52.0.0-alpha"
edition = "2024"

#the board generator is ~10x faster in o2
[profile.release]
opt-level = 2

[dependencies]
adw = { version = "0.9.1", package = "libadwaita", features = ["v1_9"] }
gtk = { version = "0.11.3", package = "gtk4", features = ["v4_22"] }
gettext-rs = { version = "0.7.7", features = ["gettext-system"] }
#for importing saves and highscores
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
#for generating the puzzles
fastrand = "2.4.1"
#for printing - part of gtk-rs
pangocairo = "0.22.0"
